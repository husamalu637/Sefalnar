<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدى الطفولة | سيف النار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #0b0f19;
            --card: #161e2e;
            --text: #ffffff;
            --accent: #ff9800;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 40px 0; text-align: center;
        }

        header h1 { margin: 0; font-size: 2.2rem; font-weight: 900; }

        .main-container {
            max-width: 900px; width: 95%; margin: 30px auto;
        }

        .video-wrapper {
            background: #000;
            border-radius: 20px;
            overflow: hidden; 
            border: 3px solid var(--primary);
            margin-bottom: 30px;
            display: none;
            position: relative;
        }

        .responsive-iframe {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
        }

        .responsive-iframe iframe {
            position: absolute;
            /* الوزنية المعتمدة لإنزال الفيديو */
            top: -155px; 
            left: 0;
            width: 100%;
            height: calc(100% + 155px); 
            border: 0;
        }

        .video-footer {
            padding: 15px;
            background: var(--card);
            text-align: center;
            font-weight: bold;
            color: var(--primary);
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 10px;
        }

        .ep-btn {
            background: #252f44;
            color: white;
            padding: 12px 0;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.3s;
        }

        .ep-btn:hover { background: var(--primary); color: #000; }
        .ep-btn.active { background: var(--accent); color: #000; }

        footer { margin: 40px 0; opacity: 0.5; font-size: 0.8rem; }
    </style>
</head>
<body>

<header>
    <h1>🎬 صدى الطفولة</h1>
    <p>سيف النار - القائمة الكاملة (108 حلقة)</p>
</header>

<div class="main-container">
    <div id="videoContainer" class="video-wrapper">
        <div class="responsive-iframe">
            <iframe id="mainIframe" src="" frameborder="0" allowfullscreen="true" scrolling="no"></iframe>
        </div>
        <div id="epTitle" class="video-footer">اختر حلقة للبدء</div>
    </div>

    <div class="episodes-container" style="background: var(--card); padding: 20px; border-radius: 20px;">
        <div class="episodes-grid" id="buttonsGrid"></div>
    </div>
</div>

<footer>
    <p>جميع الحقوق محفوظة - صدى الطفولة &copy; 2026</p>
</footer>

<script>
    // مصفوفة الروابط المباشرة (تم توليدها بناءً على التسلسل 1843 وما بعده)
    const episodes = [];
    const baseId = 1843;
    const total = 108;

    for (let i = 0; i < total; i++) {
        episodes.push(`https://cartoony.net/watch/215/${baseId + i}`);
    }

    const grid = document.getElementById('buttonsGrid');
    const container = document.getElementById('videoContainer');
    const iframe = document.getElementById('mainIframe');
    const titleDisp = document.getElementById('epTitle');

    // إنشاء الأزرار بناءً على الروابط الموجودة في المصفوفة
    episodes.forEach((link, index) => {
        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        btn.innerText = index + 1;
        
        btn.onclick = function() {
            // الإعلان
            window.open('https://www.profitablecpmratenetwork.com/e41dj2h87?key=bef514b5ca3fa945e7a3b60e4a9ef21a', '_blank');
            
            container.style.display = 'block';
            iframe.src = link;
            titleDisp.innerText = "أنت تشاهد الآن: سيف النار - حلقة " + (index + 1);
            
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        grid.appendChild(btn);
    });
</script>

</body>
</html>
